name: Backend live smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'develop/**'
      - 'alpha/**'
    paths:
      - 'supabase/functions/**'
      - 'scripts/backend-probes*'
      - 'scripts/evaluate-backend.mjs'
      - 'scripts/fixtures/backend-model-responses.json'
      - '.github/workflows/backend-live-smoke.yml'

permissions:
  contents: read

concurrency:
  group: backend-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-live-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Probe live synthetic contracts and contextual agent
        run: node scripts/evaluate-backend.mjs --live --report backend-live-reports/results.json

      - name: Upload every live comparison including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masahati-backend-live-diagnostics
          path: backend-live-reports/
          if-no-files-found: error
          retention-days: 14
