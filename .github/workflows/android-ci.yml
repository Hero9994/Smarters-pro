name: Android CI

on:
  push:
    branches:
      - main
      - 'develop/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build, lint and test
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify integrated APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          META="app/build/outputs/apk/debug/output-metadata.json"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$META"
          test -f "$APK"
          jq -e '.applicationId == "app.masahati.mobile.v07" and .elements[0].versionCode == 7 and .elements[0].versionName == "0.7.0-dev"' "$META"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload integrated debug APK
        uses: actions/upload-artifact@v7
        with:
          name: masahati-v0.7-local-intelligence-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masahati-v0.7-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
